server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One address only: www (mapped to this Cloud Run service) goes to the apex.
    if ($host = www.bayanwin.net) {
        return 301 https://bayanwin.net$request_uri;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json application/manifest+json;

    # Every public route is prerendered to <route>/index.html at build time.
    # Anything else is a real 404, not a 200 with an empty app shell.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Installable app: browsers want this MIME type for the manifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The service worker must never be cached, or fixes to it never reach phones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Note: /api proxy removed - frontend calls backend directly via VITE_API_URL
    # The frontend React app uses the API URL from VITE_API_URL environment variable

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
